<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>교육 사례 | 코스모에듀</title><meta name="description" content="코스모에듀 AI 융합 프로젝트 실제 수업 사례와 학생 결과물을 확인하세요."><link rel="icon" href="img/favicon.png">
  <style>
    :root{--ink:#10203a;--muted:#66768b;--line:#dfe6ef;--blue:#2563eb;--navy:#143764;--cyan:#0891b2;--bg:#f5f8fc;--white:#fff;--r:10px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI','Malgun Gothic',sans-serif;line-height:1.65}a{text-decoration:none;color:inherit}img{display:block;max-width:100%}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}.header{height:68px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);display:flex;align-items:center;position:sticky;top:0;z-index:20}.header-in{display:flex;align-items:center;justify-content:space-between}.logo img{height:25px;width:auto}.back{font-size:14px;font-weight:700;color:#526077}.hero{padding:66px 0 54px;background:#fff;border-bottom:1px solid var(--line)}.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center}.eyebrow{font-size:13px;color:var(--blue);font-weight:800}.hero h1{font-size:clamp(34px,5vw,54px);line-height:1.15;margin:10px 0 18px;letter-spacing:0}.lead{font-size:17px;color:var(--muted);word-break:keep-all}.hero-img{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:0 18px 48px rgba(21,45,80,.16)}.hero-img img{width:100%;aspect-ratio:16/10;object-fit:cover}.hero-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{display:inline-block;padding:12px 18px;border-radius:6px;font-weight:800;font-size:14px}.btn-p{background:var(--blue);color:#fff}.btn-o{border:1px solid var(--line);background:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:28px}.stat{border-left:3px solid var(--blue);padding:5px 12px}.stat strong{display:block;font-size:21px}.stat span{font-size:12px;color:var(--muted)}.sec{padding:68px 0}.sec-white{background:#fff}.sec-head{margin-bottom:26px}.sec-head h2{font-size:30px;margin:0 0 7px}.sec-head p{margin:0;color:var(--muted)}.tracks{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.track{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px}.track b{display:inline-block;color:var(--blue);font-size:12px;margin-bottom:8px}.track h3{font-size:17px;line-height:1.35;margin:0 0 8px}.track p{font-size:13px;color:var(--muted);margin:0}.results{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.result{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:.2s}.result:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(20,45,80,.12)}.thumb{aspect-ratio:16/10;overflow:hidden;background:#e9eff7;position:relative}.thumb img{width:100%;height:100%;object-fit:cover}.play{position:absolute;right:10px;bottom:10px;background:rgba(15,32,58,.88);color:#fff;border-radius:100px;padding:6px 10px;font-size:11px;font-weight:800}.result-copy{padding:16px}.tag{font-size:11px;font-weight:800;color:var(--blue);margin-bottom:5px}.result h3{font-size:17px;margin:0 0 6px}.result p{font-size:13px;color:var(--muted);margin:0}.notice{margin-top:18px;font-size:12px;color:#7b8798}.cta{background:var(--navy);color:#fff;border-radius:10px;padding:34px;display:flex;justify-content:space-between;align-items:center}.cta h2{margin:0 0 6px}.cta p{margin:0;color:#d8e5f4}.cta .btn{background:#fff;color:var(--navy)}footer{background:#0e1c32;color:#b9c5d5;padding:28px 0;font-size:12px}.footer-in{display:flex;justify-content:space-between;gap:20px}footer strong{color:#fff}
    @media(max-width:900px){.hero-grid{grid-template-columns:1fr}.tracks{grid-template-columns:repeat(2,1fr)}.results{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.stats{grid-template-columns:1fr}.tracks,.results{grid-template-columns:1fr}.cta{display:block}.cta .btn{margin-top:18px}.footer-in{display:block}.footer-in div+div{margin-top:8px}}
  </style>
</head>
<body>
  <header class="header"><div class="wrap header-in"><a class="logo" href="index.html"><img src="https://app.cosmoedu.co.kr/resource/cosmoedu_logo(white)_1024x180.png" alt="코스모에듀"></a><a class="back" href="specials.html">월별 특강 보기</a></div></header>
  <main id="caseRoot"></main>
  <footer><div class="wrap footer-in"><div><strong>코스모에듀벤처주식회사</strong><br>대표 전두표 · 경기도 용인시 흥덕2로 117번길 19, 918호</div><div>문의 070-4337-4337</div></div></footer>
  <script src="data/case-studies.js"></script>
  <script>
    (function(){var all=window.COSMO_CASE_STUDIES||[],id=new URLSearchParams(location.search).get('id')||'buwon',x=all.find(function(v){return v.id===id})||all[0],root=document.getElementById('caseRoot');function e(v){return String(v||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}if(!x){root.innerHTML='<div class="wrap sec">등록된 사례가 없습니다.</div>';return}document.title=x.institution+' AI 프로젝트 사례 | 코스모에듀';root.innerHTML='<section class="hero"><div class="wrap hero-grid"><div><div class="eyebrow">'+e(x.type)+' · '+e(x.year)+'</div><h1>'+e(x.title)+'</h1><p class="lead">'+e(x.summary)+'</p><div class="hero-links"><a class="btn btn-p" href="#results">학생 결과물 보기</a><a class="btn btn-o" href="'+e(x.portalUrl)+'" target="_blank" rel="noopener">프로젝트 포털 보기</a></div><div class="stats">'+x.stats.map(function(v){return '<div class="stat"><strong>'+e(v[0])+'</strong><span>'+e(v[1])+'</span></div>'}).join('')+'</div></div><div class="hero-img"><img src="'+e(x.cover)+'" alt="'+e(x.institution)+' 학생 결과물"></div></div></section><section class="sec"><div class="wrap"><div class="sec-head"><h2>수업 구성</h2><p>하나의 도구 체험이 아니라 교과 주제를 실제 디지털 결과물로 연결했습니다.</p></div><div class="tracks">'+x.tracks.map(function(v){return '<article class="track"><b>'+e(v[0])+'</b><h3>'+e(v[1])+'</h3><p>'+e(v[2])+'</p></article>'}).join('')+'</div></div></section><section class="sec sec-white" id="results"><div class="wrap"><div class="sec-head"><h2>실제 학생 결과물</h2><p>이미지를 누르면 학생이 제작한 웹앱과 디지털 작품이 새 창에서 실행됩니다.</p></div><div class="results">'+x.results.map(function(v){return '<a class="result" href="'+e(v.url)+'" target="_blank" rel="noopener"><div class="thumb"><img src="'+e(v.image)+'" alt="'+e(v.title)+'"><span class="play">실제 결과물 열기 ↗</span></div><div class="result-copy"><div class="tag">'+e(v.category)+'</div><h3>'+e(v.title)+'</h3><p>'+e(v.description)+'</p></div></a>'}).join('')+'</div><p class="notice">학생 개인정보 보호를 위해 계정명과 개인 식별 정보는 표시하지 않았습니다. 일부 작품은 제작 당시 환경에 따라 기능이 제한될 수 있습니다.</p></div></section><section class="sec"><div class="wrap"><div class="cta"><div><h2>우리 학교도 프로젝트 수업을 시작해 보세요</h2><p>학교 주제와 일정에 맞춰 수업 구성과 결과물 전시까지 설계합니다.</p></div><a class="btn" href="index.html#contact">프로젝트 제안 문의</a></div></div></section>'})();
  </script>
</body></html>
